name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install locked environment
        # uv.lock is the only dependency input for CI.
        run: uv sync --locked --dev
      - name: Build outside the repository and prove cleanup
        run: |
          set -euo pipefail
          build_dir=$(mktemp -d "${RUNNER_TEMP:?}/kw-notice-mcp-build.XXXXXX")
          cleanup() {
            rm -rf -- "$build_dir"
          }
          trap cleanup EXIT
          uv build --out-dir "$build_dir"
          test "$(find "$build_dir" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$build_dir" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          cleanup
          test ! -e "$build_dir"
          trap - EXIT
          test ! -e dist
          test ! -e build
      - name: No-excuse checker
        run: uv run python scripts/check_no_excuse_rules.py src tests
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Basedpyright
        run: uv run basedpyright
      - name: Unit and integration tests
        run: uv run pytest -q
      - name: STDIO E2E suite
        run: uv run pytest tests/integration/test_mcp.py -q -k all_four_tools_over_stdio
